<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 112" width="1200" height="112" role="img" aria-label="Mithil Salunkhe. 3,364 contributions in the last twelve months.">
<defs><linearGradient id="rl" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#106b31"/>
<stop offset="1" stop-color="#106b31" stop-opacity="0"/></linearGradient></defs>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.sweep{transform-origin:0 0;transform:scaleX(1);animation:sw .9s cubic-bezier(.2,.8,.3,1)}
