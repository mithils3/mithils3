<text class="m" x="1200" y="72" font-size="12" letter-spacing="1.1" text-anchor="end" fill="#818b98">CONTRIBUTIONS · LAST 12 MONTHS</text>
<text class="m" x="1200" y="90" font-size="12" letter-spacing="1.1" text-anchor="end" fill="#818b98">1,459 COMMITS</text>
