@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<text class="s" x="0" y="48" font-size="42" font-weight="700" letter-spacing="-1.3" fill="#1f2328">Mithil Salunkhe</text>
<rect class="sweep" x="0" y="62" width="268" height="2" rx="1" fill="url(#rl)"/>
<text class="m" x="0" y="90" font-size="15" fill="#59636e">CS @ Illinois  ·  agent evaluation, ML systems, HPC</text>
