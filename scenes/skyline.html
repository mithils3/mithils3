<!doctype html>
<meta charset="utf-8">
<title>skyline</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">
{"imports":{
  "three":"/node_modules/three/build/three.module.js",
  "three/addons/":"/node_modules/three/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import * as BufferGeometryUtils from "three/addons/utils/BufferGeometryUtils.js";

const W = 2000, H = 620;
const Q = new URLSearchParams(location.search);
const num = (k, d) => Q.has(k) ? parseFloat(Q.get(k)) : d;
const PITCH = 1.16, CELL = 1.0, MAXH = num("maxh", 6.2);

// sequential orange ramp, same family as the flat SVG charts
const RAMP = ["#8f4413", "#c9600f", "#f0800c", "#ff9c3d"].map(h => new THREE.Color(h));
const EMPTY = new THREE.Color("#6d7684");

const rampAt = t => {
  const x = Math.min(0.999, Math.max(0, t)) * (RAMP.length - 1);
  const i = Math.floor(x);
  return RAMP[i].clone().lerp(RAMP[i + 1] ?? RAMP[i], x - i);
};

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, W / H, 0.5, 400);
const target = new THREE.Vector3(0, 1.1, 0);

scene.add(new THREE.HemisphereLight(0xd6e2f2, 0x2b3240, 1.15));
const key = new THREE.DirectionalLight(0xfff2e2, 2.5);
key.position.set(-30, 46, 30);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 3;
const sc = key.shadow.camera;
sc.left = -60; sc.right = 60; sc.top = 45; sc.bottom = -45; sc.near = 1; sc.far = 180;
sc.updateProjectionMatrix();
scene.add(key);
const rim = new THREE.DirectionalLight(0xff9a4a, 0.85);
rim.position.set(34, 12, -28);
scene.add(rim);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(160, 60),
  new THREE.ShadowMaterial({ opacity: 0.3, color: 0x0b1018 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
ground.position.y = -0.002;
scene.add(ground);

const res = await fetch("/data/contributions.json");
const data = await res.json();
const weeks = data.weeks;

const counts = weeks.flat().map(d => d.contributionCount).filter(c => c > 0).sort((a, b) => a - b);
const cap = counts[Math.floor(counts.length * 0.94)] || 1;

const geoms = [];
const nx = weeks.length, nz = 7;
const x0 = -((nx - 1) * PITCH) / 2, z0 = -((nz - 1) * PITCH) / 2;

for (let wi = 0; wi < nx; wi++) {
  for (const day of weeks[wi]) {
    const c = day.contributionCount;
    const t = c > 0 ? Math.min(1, c / cap) ** 0.72 : 0;
    const h = c > 0 ? 0.22 + MAXH * t : 0.09;
    const r = Math.min(0.13, h * 0.42, CELL * 0.24);
    const g = new RoundedBoxGeometry(CELL, h, CELL, 2, r);
    g.translate(x0 + wi * PITCH, h / 2, z0 + day.weekday * PITCH);
    const col = c > 0 ? rampAt(t) : EMPTY;
    const n = g.attributes.position.count;
    const arr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) col.toArray(arr, i * 3);
    g.setAttribute("color", new THREE.BufferAttribute(arr, 3));
    geoms.push(g);
  }
}

const merged = BufferGeometryUtils.mergeGeometries(geoms, false);
merged.computeBoundingBox();
merged.computeBoundingSphere();
const mat = new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.44, metalness: 0.06,
});
const city = new THREE.Mesh(merged, mat);
city.castShadow = true;
city.receiveShadow = true;
scene.add(city);

const AZ0 = num("az0", -0.16), AZ1 = num("az1", 0.02), EL = num("el", 0.62);
const ease = t => t * t * (3 - 2 * t);

const bb = merged.boundingBox;
const corners = [];
for (const x of [bb.min.x, bb.max.x])
  for (const y of [bb.min.y, bb.max.y])
    for (const z of [bb.min.z, bb.max.z]) corners.push(new THREE.Vector3(x, y, z));

const place = (az, R) => {
  camera.position.set(
    target.x + R * Math.sin(az) * Math.cos(EL),
    target.y + R * Math.sin(EL),
    target.z + R * Math.cos(az) * Math.cos(EL)
  );
  camera.lookAt(target);
  camera.updateMatrixWorld(true);
  camera.updateProjectionMatrix();
};

// smallest distance at which every bounding-box corner stays inside the margin
const fit = (az, margin) => {
  let lo = 20, hi = 400;
  for (let k = 0; k < 40; k++) {
    const R = (lo + hi) / 2;
    place(az, R);
    let ok = true;
    for (const c of corners) {
      const p = c.clone().project(camera);
      if (Math.abs(p.x) > 1 - margin || Math.abs(p.y) > 1 - margin) { ok = false; break; }
    }
    if (ok) hi = R; else lo = R;
  }
  return hi;
};

// one distance for the whole loop, so the camera orbits without dollying
const R = Math.max(fit(AZ0, 0.02), fit(AZ1, 0.02));
window.FIT_R = R;

// tightest pixel rect containing the city across the whole sweep, so the
// exported frame has no dead margin and a constant aspect
const ndc = { x0: 1, x1: -1, y0: 1, y1: -1 };
for (let k = 0; k <= 24; k++) {
  place(AZ0 + (AZ1 - AZ0) * (k / 24), R);
  for (const c of corners) {
    const q = c.clone().project(camera);
    ndc.x0 = Math.min(ndc.x0, q.x); ndc.x1 = Math.max(ndc.x1, q.x);
    ndc.y0 = Math.min(ndc.y0, q.y); ndc.y1 = Math.max(ndc.y1, q.y);
  }
}
const padX = 0.012 * (ndc.x1 - ndc.x0), padY = 0.10 * (ndc.y1 - ndc.y0);
const px = v => ((v + 1) / 2) * W, py = v => ((1 - v) / 2) * H;
window.CROP = {
  x: Math.max(0, Math.floor(px(ndc.x0 - padX))),
  y: Math.max(0, Math.floor(py(ndc.y1 + padY))),
  width: Math.min(W, Math.ceil(px(ndc.x1 + padX) - px(ndc.x0 - padX))),
  height: Math.min(H, Math.ceil(py(ndc.y0 - padY) - py(ndc.y1 + padY))),
};

window.setFrame = (i, n) => {
  place(AZ0 + (AZ1 - AZ0) * ease(n > 1 ? i / (n - 1) : 0), R);
  renderer.render(scene, camera);
};

window.setFrame(0, 2);
window.SCENE_READY = true;
</script>
