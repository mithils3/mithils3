<!doctype html>
<meta charset="utf-8">
<title>skyline</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">
{"imports":{
  "three":"/node_modules/three/build/three.module.js",
  "three/addons/":"/node_modules/three/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import * as BufferGeometryUtils from "three/addons/utils/BufferGeometryUtils.js";

const Q = new URLSearchParams(location.search);
const num = (k, d) => Q.has(k) ? parseFloat(Q.get(k)) : d;

const W = num("w", 2000), H = num("h", 620);
const PITCH = 1.16, CELL = 1.0, MAXH = num("maxh", 6.2);

// sequential orange ramp, same family as the flat SVG figures
const RAMP = ["#8f4413", "#c9600f", "#f0800c", "#ff9c3d"].map(h => new THREE.Color(h));
const EMPTY = new THREE.Color("#6d7684");

const rampAt = t => {
  const x = Math.min(0.999, Math.max(0, t)) * (RAMP.length - 1);
  const i = Math.floor(x);
  return RAMP[i].clone().lerp(RAMP[i + 1] ?? RAMP[i], x - i);
};

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, W / H, 0.5, 400);
const target = new THREE.Vector3(0, 1.1, 0);

scene.add(new THREE.HemisphereLight(0xd6e2f2, 0x2b3240, 1.15));
const key = new THREE.DirectionalLight(0xfff2e2, 2.5);
key.position.set(-30, 46, 30);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 3;
const sc = key.shadow.camera;
sc.left = -60; sc.right = 60; sc.top = 45; sc.bottom = -45; sc.near = 1; sc.far = 180;
sc.updateProjectionMatrix();
scene.add(key);
const rim = new THREE.DirectionalLight(0xff9a4a, 0.85);
rim.position.set(34, 12, -28);
scene.add(rim);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(160, 60),
  new THREE.ShadowMaterial({ opacity: 0.3, color: 0x0b1018 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.002;
ground.receiveShadow = true;
scene.add(ground);

const data = await (await fetch("/data/contributions.json")).json();
const weeks = data.weeks;
const nx = weeks.length, nz = 7;
const x0 = -((nx - 1) * PITCH) / 2, z0 = -((nz - 1) * PITCH) / 2;

const counts = weeks.flat().map(d => d.contributionCount).filter(c => c > 0).sort((a, b) => a - b);
const cap = counts[Math.floor(counts.length * 0.94)] || 1;

// one cell per day, tagged with the month it belongs to so the build can
// advance a month at a time
const months = [...new Set(weeks.flat().map(d => d.date.slice(0, 7)))].sort();
const cells = [];
for (let wi = 0; wi < nx; wi++) {
  for (const day of weeks[wi]) {
    const c = day.contributionCount;
    const t = c > 0 ? Math.min(1, c / cap) ** 0.72 : 0;
    cells.push({
      x: x0 + wi * PITCH, z: z0 + day.weekday * PITCH,
      full: c > 0 ? 0.22 + MAXH * t : 0.09,
      floor: c > 0 ? 0.09 : 0.09,
      color: c > 0 ? rampAt(t) : EMPTY,
      month: months.indexOf(day.date.slice(0, 7)),
      week: wi,
      date: day.date,
      count: c,
    });
  }
}

const material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.44, metalness: 0.06 });

// one mesh per month, so a frame only rebuilds the month that is currently
// rising instead of all 371 towers
const byMonth = months.map((_, m) => cells.filter(c => c.month === m));
const meshes = new Array(months.length).fill(null);
const lastP = new Array(months.length).fill(-1);

function geomFor(group, heightOf, colorOf = c => c.color) {
  const geoms = [];
  for (const c of group) {
    const h = Math.max(0.06, heightOf(c));
    const r = Math.min(0.13, h * 0.42, CELL * 0.24);
    const g = new RoundedBoxGeometry(CELL, h, CELL, 2, r);
    g.translate(c.x, h / 2, c.z);
    const n = g.attributes.position.count;
    const arr = new Float32Array(n * 3);
    const col = colorOf(c);
    for (let i = 0; i < n; i++) col.toArray(arr, i * 3);
    g.setAttribute("color", new THREE.BufferAttribute(arr, 3));
    geoms.push(g);
  }
  const merged = BufferGeometryUtils.mergeGeometries(geoms, false);
  for (const g of geoms) g.dispose();
  return merged;
}

function setMonth(m, p) {
  if (lastP[m] === p) return;
  lastP[m] = p;
  // colour arrives with the height, so an unbuilt month reads as pending
  const g = geomFor(byMonth[m], c => c.floor + (c.full - c.floor) * p,
                    c => EMPTY.clone().lerp(c.color, p));
  if (meshes[m]) { scene.remove(meshes[m]); meshes[m].geometry.dispose(); }
  const mesh = new THREE.Mesh(g, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  meshes[m] = mesh;
  scene.add(mesh);
}

months.forEach((_, m) => setMonth(m, 1));
const fullGeom = geomFor(cells, c => c.full);
fullGeom.computeBoundingBox();
const bb = fullGeom.boundingBox;
const corners = [];
for (const x of [bb.min.x, bb.max.x])
  for (const y of [bb.min.y, bb.max.y])
    for (const z of [bb.min.z, bb.max.z]) corners.push(new THREE.Vector3(x, y, z));

const AZ = num("az", -0.07), EL = num("el", 0.62);
const place = R => {
  camera.position.set(
    target.x + R * Math.sin(AZ) * Math.cos(EL),
    target.y + R * Math.sin(EL),
    target.z + R * Math.cos(AZ) * Math.cos(EL)
  );
  camera.lookAt(target);
  camera.updateMatrixWorld(true);
  camera.updateProjectionMatrix();
};

let lo = 20, hi = 400;
for (let k = 0; k < 40; k++) {
  const R = (lo + hi) / 2;
  place(R);
  const ok = corners.every(c => {
    const p = c.clone().project(camera);
    return Math.abs(p.x) <= 0.98 && Math.abs(p.y) <= 0.98;
  });
  if (ok) hi = R; else lo = R;
}
place(hi);
window.FIT_R = hi;

const ndc = { x0: 1, x1: -1, y0: 1, y1: -1 };
for (const c of corners) {
  const q = c.clone().project(camera);
  ndc.x0 = Math.min(ndc.x0, q.x); ndc.x1 = Math.max(ndc.x1, q.x);
  ndc.y0 = Math.min(ndc.y0, q.y); ndc.y1 = Math.max(ndc.y1, q.y);
}
const padX = 0.012 * (ndc.x1 - ndc.x0), padY = 0.10 * (ndc.y1 - ndc.y0);
const px = v => ((v + 1) / 2) * W, py = v => ((1 - v) / 2) * H;
window.CROP = {
  x: Math.max(0, Math.floor(px(ndc.x0 - padX))),
  y: Math.max(0, Math.floor(py(ndc.y1 + padY))),
  width: Math.min(W, Math.ceil(px(ndc.x1 + padX) - px(ndc.x0 - padX))),
  height: Math.min(H, Math.ceil(py(ndc.y0 - padY) - py(ndc.y1 + padY))),
};

// month-at-a-time build. Each month opens on its own beat and the days inside
// it stagger by a fraction of a beat, so the year reads as twelve steps.
const SPAN = num("span", 0.80), DUR = num("dur", 0.11);
const back = t => { const s = 1.15; return 1 + (s + 1) * (t - 1) ** 3 + s * (t - 1) ** 2; };

const startOf = m => (m / months.length) * SPAN;
const progressOf = (m, t) => {
  const p = Math.min(1, Math.max(0, (t - startOf(m)) / DUR));
  return p <= 0 ? 0 : p >= 1 ? 1 : back(p);
};

window.setBuild = t => {
  months.forEach((_, m) => setMonth(m, progressOf(m, t)));
  renderer.render(scene, camera);
};

// where the overlay puts each month's label, and the callout for the busiest
// day, in viewport pixels
const project = (x, y, z) => {
  const p = new THREE.Vector3(x, y, z).project(camera);
  return { x: ((p.x + 1) / 2) * W, y: ((1 - p.y) / 2) * H };
};
const frontZ = z0 + (nz - 1) * PITCH + PITCH * 0.75;
window.ANCHORS = {
  months: months.map((key, m) => {
    const first = byMonth[m][0];
    return { key, m, start: startOf(m), dur: DUR, ...project(first.x - PITCH / 2, 0, frontZ) };
  }),
  peak: (() => {
    const c = cells.reduce((a, b) => (b.count > a.count ? b : a));
    return { count: c.count, date: c.date, month: c.month,
             start: startOf(c.month), dur: DUR, ...project(c.x, c.full, c.z) };
  })(),
};

window.MONTHS = months.length;
window.setBuild(1);
window.SCENE_READY = true;
</script>
