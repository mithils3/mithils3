name: Rebuild assets

# Everything on this profile is vector and pure Python now, so one cheap job
# rebuilds the whole page from live data every morning. No browser, no npm,
# no GPU.

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "data/**"
      - ".github/workflows/assets.yml"

permissions:
  contents: write

concurrency:
  group: assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_contributions.py

      - name: Render assets
        run: |
          python3 scripts/build_skyline.py
          python3 scripts/build_svgs.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh generated assets"
          git pull --rebase origin main
          git push
